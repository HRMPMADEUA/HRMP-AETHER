name: TIREXNET Android Build (Full SlipNet Runtime)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout TIREXNET
        uses: actions/checkout@v4

      - name: Checkout SlipNet source
        uses: actions/checkout@v4
        with:
          repository: anonvector/SlipNet
          ref: 2ed00fd0072ad0b558e30ec6b5e8b30948f98894
          path: .native-src/slipnet
          submodules: false

      - name: Checkout Xray source
        uses: actions/checkout@v4
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: 5fa2b07eb4794023ac79a2f6cbfcae198de0b076
          path: .native-src/xray

      - name: Initialize available SlipNet submodules
        shell: bash
        run: |
          set -euo pipefail
          cd .native-src/slipnet

          git submodule update --init --recursive --jobs 4 -- \
            app/src/main/rust/slipstream-rust \
            app/src/main/rust/slipstream-rust-plus \
            dnstt \
            lyrebird \
            noizdns \
            vaydns \
            vaydns-mobile

          test -f LICENSE
          test -d gomobile-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK and NDK toolchains
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.2.12479018 ndk;29.0.14206865'

      - name: Fix Android 37 SDK platform directory
        shell: bash
        run: |
          set -euo pipefail

          PLATFORM_ROOT="$ANDROID_HOME/platforms"

          if [ -d "$PLATFORM_ROOT/android-37.0" ]; then
            if [ ! -e "$PLATFORM_ROOT/android-37" ]; then
              ln -s android-37.0 "$PLATFORM_ROOT/android-37"
            fi
          else
            echo "::error::Android 37.0 SDK platform was not installed."
            ls -la "$PLATFORM_ROOT"
            exit 1
          fi

          test -f "$PLATFORM_ROOT/android-37/android.jar"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Stage SlipNet source and resources
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/integrate-slipnet.sh .native-src/slipnet

      - name: Verify combined TIREXNET, SlipNet and Xray staging
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="app/src/main/java/app/slipnet/presentation/settings/SettingsViewModel.kt"
          SLIPNET_MAIN="app/src/main/java/app/slipnet/presentation/MainActivity.kt"
          TIREX_MAIN="app/src/main/java/com/hrmp/aether/MainActivity.kt"

          test -s "$SETTINGS"
          test -s "$SLIPNET_MAIN"
          test -s "$TIREX_MAIN"
          test -s app/src/main/cpp/Android.mk
          test -s app/src/main/java/com/tirexnet/app/TirexApplication.kt
          test -s app/src/main/java/com/tirexnet/app/TirexSlipNetEntryPoint.kt
          test -s app/src/main/java/com/tirexnet/app/SlipNetConnectActivity.kt
          test -s app/src/main/java/com/tirexnet/app/SlipNetSettingsActivity.kt
          test -s app/src/main/java/com/hrmp/aether/engine/XrayVpnService.kt

          grep -Fq 'data class MainSettingsCore' "$SETTINGS"
          grep -Fq 'main.autoConnectOnBoot' "$SETTINGS"
          grep -Fq 'slipnet-bundle-enc://' "$SLIPNET_MAIN"
          grep -Fq 'openSlipNetRuntime(raw)' "$TIREX_MAIN"
          grep -Fq 'slipNetConnectionManager.disconnect()' "$TIREX_MAIN"

          if grep -Eq 'main\[[0-6]\] as ' "$SETTINGS"; then
            echo "::error::Unsafe Kotlin heterogeneous-array casts remain in SlipNet SettingsViewModel."
            exit 1
          fi

          python3 - <<'PYMANIFEST'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = manifest.find("application")
          assert app is not None, "Android application element is missing"
          assert app.get(android + "name") == ".TirexApplication", "TIREXNET Hilt Application is not configured"
          activities = {x.get(android + "name") for x in app.findall("activity")}
          services = {x.get(android + "name") for x in app.findall("service")}
          required_activities = {
              ".MainActivity",
              "app.slipnet.presentation.MainActivity",
              "com.tirexnet.app.SlipNetConnectActivity",
              "com.tirexnet.app.SlipNetSettingsActivity",
          }
          required_services = {
              ".engine.XrayVpnService",
              "app.slipnet.service.SlipNetVpnService",
              ".engine.DnsChangerVpnService",
          }
          missing = (required_activities - activities) | (required_services - services)
          assert not missing, "Manifest entries missing: " + ", ".join(sorted(missing))
          print("Manifest integration checks passed.")
          PYMANIFEST

          echo "TIREXNET + full SlipNet + Xray integration staging verified."

      - name: Add SlipNet and Xray licenses
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/third_party

          cp .native-src/slipnet/LICENSE \
            app/src/main/assets/third_party/SLIPNET-AGPL-3.0.txt

          cp .native-src/xray/LICENSE \
            app/src/main/assets/third_party/ANDROIDLIBXRAY-LICENSE.txt

          cat > app/src/main/assets/third_party/SLIPNET-SOURCE-NOTICE.md <<'NOTICE'
          # TIREXNET third-party source notice

          ## SlipNet

          Repository:
          https://github.com/anonvector/SlipNet

          Pinned upstream commit:
          2ed00fd0072ad0b558e30ec6b5e8b30948f98894

          ## AndroidLibXrayLite

          Repository:
          https://github.com/2dust/AndroidLibXrayLite

          Pinned upstream commit:
          5fa2b07eb4794023ac79a2f6cbfcae198de0b076

          Corresponding source trees and license files are included
          in the TIREXNET corresponding-source artifact.
          NOTICE

          test -s app/src/main/assets/third_party/SLIPNET-AGPL-3.0.txt
          test -s app/src/main/assets/third_party/ANDROIDLIBXRAY-LICENSE.txt
