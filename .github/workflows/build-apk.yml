name: TIREXNET Android Build (Full SlipNet Runtime)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout TIREXNET
        uses: actions/checkout@v4

      - name: Checkout SlipNet source
        uses: actions/checkout@v4
        with:
          repository: anonvector/SlipNet
          ref: 2ed00fd0072ad0b558e30ec6b5e8b30948f98894
          path: .native-src/slipnet
          submodules: false

      - name: Checkout Xray source
        uses: actions/checkout@v4
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: 5fa2b07eb4794023ac79a2f6cbfcae198de0b076
          path: .native-src/xray

      - name: Initialize available SlipNet submodules
        shell: bash
        run: |
          set -euo pipefail
          cd .native-src/slipnet

          git submodule update --init --recursive --jobs 4 -- \
            app/src/main/rust/slipstream-rust \
            app/src/main/rust/slipstream-rust-plus \
            dnstt \
            lyrebird \
            noizdns \
            vaydns \
            vaydns-mobile

          test -f LICENSE
          test -d gomobile-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK and NDK toolchains
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.2.12479018 ndk;29.0.14206865'

      - name: Fix Android 37 SDK platform directory
        shell: bash
        run: |
          set -euo pipefail

          PLATFORM_ROOT="$ANDROID_HOME/platforms"

          if [ -d "$PLATFORM_ROOT/android-37.0" ]; then
            if [ ! -e "$PLATFORM_ROOT/android-37" ]; then
              ln -s android-37.0 "$PLATFORM_ROOT/android-37"
            fi
          else
            echo "::error::Android 37.0 SDK platform was not installed."
            ls -la "$PLATFORM_ROOT"
            exit 1
          fi

          test -f "$PLATFORM_ROOT/android-37/android.jar"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Stage SlipNet source and resources
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/integrate-slipnet.sh .native-src/slipnet

      - name: Verify combined TIREXNET, SlipNet and Xray staging
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="app/src/main/java/app/slipnet/presentation/settings/SettingsViewModel.kt"
          SLIPNET_MAIN="app/src/main/java/app/slipnet/presentation/MainActivity.kt"
          TIREX_MAIN="app/src/main/java/com/hrmp/aether/MainActivity.kt"

          test -s "$SETTINGS"
          test -s "$SLIPNET_MAIN"
          test -s "$TIREX_MAIN"
          test -s app/src/main/cpp/Android.mk
          test -s app/src/main/java/com/tirexnet/app/TirexApplication.kt
          test -s app/src/main/java/com/tirexnet/app/TirexSlipNetEntryPoint.kt
          test -s app/src/main/java/com/tirexnet/app/SlipNetConnectActivity.kt
          test -s app/src/main/java/com/tirexnet/app/SlipNetSettingsActivity.kt
          test -s app/src/main/java/com/hrmp/aether/engine/XrayVpnService.kt

          grep -Fq 'data class MainSettingsCore' "$SETTINGS"
          grep -Fq 'main.autoConnectOnBoot' "$SETTINGS"
          grep -Fq 'slipnet-bundle-enc://' "$SLIPNET_MAIN"
          grep -Fq 'startSlipNetRuntime(pendingRaw)' "$TIREX_MAIN"
          grep -Fq 'slipNetRuntime.disconnect()' "$TIREX_MAIN"
          grep -Fq 'slipNetRuntime.connectionState.collect' "$TIREX_MAIN"
          test -s app/src/main/java/com/tirexnet/app/TirexSlipNetRuntime.kt

          if grep -Eq 'main\[[0-6]\] as ' "$SETTINGS"; then
            echo "::error::Unsafe Kotlin heterogeneous-array casts remain in SlipNet SettingsViewModel."
            exit 1
          fi

          python3 - <<'PYMANIFEST'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = manifest.find("application")
          assert app is not None, "Android application element is missing"
          assert app.get(android + "name") == ".TirexApplication", "TIREXNET Hilt Application is not configured"
          activities = {x.get(android + "name") for x in app.findall("activity")}
          services = {x.get(android + "name") for x in app.findall("service")}
          required_activities = {
              ".MainActivity",
              "app.slipnet.presentation.MainActivity",
              "com.tirexnet.app.SlipNetConnectActivity",
              "com.tirexnet.app.SlipNetSettingsActivity",
          }
          required_services = {
              ".engine.XrayVpnService",
              "app.slipnet.service.SlipNetVpnService",
              ".engine.DnsChangerVpnService",
          }
          upstream_ui = next(x for x in app.findall("activity") if x.get(android + "name") == "app.slipnet.presentation.MainActivity")
          assert upstream_ui.get(android + "exported") == "false", "Upstream SlipNet UI must not be exported"
          assert not upstream_ui.findall("intent-filter"), "Upstream SlipNet UI must have no intent filters"
          missing = (required_activities - activities) | (required_services - services)
          assert not missing, "Manifest entries missing: " + ", ".join(sorted(missing))
          print("Manifest integration checks passed.")
          PYMANIFEST

          echo "TIREXNET + full SlipNet + Xray integration staging verified."

      - name: Add SlipNet and Xray licenses
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/third_party

          cp .native-src/slipnet/LICENSE \
            app/src/main/assets/third_party/SLIPNET-AGPL-3.0.txt

          cp .native-src/xray/LICENSE \
            app/src/main/assets/third_party/ANDROIDLIBXRAY-LICENSE.txt

          cat > app/src/main/assets/third_party/SLIPNET-SOURCE-NOTICE.md <<'NOTICE'
          # TIREXNET third-party source notice

          ## SlipNet

          Repository:
          https://github.com/anonvector/SlipNet

          Pinned upstream commit:
          2ed00fd0072ad0b558e30ec6b5e8b30948f98894

          ## AndroidLibXrayLite

          Repository:
          https://github.com/2dust/AndroidLibXrayLite

          Pinned upstream commit:
          5fa2b07eb4794023ac79a2f6cbfcae198de0b076

          Corresponding source trees and license files are included
          in the TIREXNET corresponding-source artifact.
          NOTICE

          test -s app/src/main/assets/third_party/SLIPNET-AGPL-3.0.txt
          test -s app/src/main/assets/third_party/ANDROIDLIBXRAY-LICENSE.txt
      - name: Build Android OpenSSL for SlipNet QUIC
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export OPENSSL_VERSION="3.0.15"
          export OUTPUT_DIR="$RUNNER_TEMP/android-openssl/android-ssl"

          bash app/scripts/build-openssl-android.sh

          mkdir -p "$HOME/android-openssl"

          cp -a "$RUNNER_TEMP/android-openssl/android-ssl" \
            "$HOME/android-openssl/"

          test -s "$HOME/android-openssl/android-ssl/arm64-v8a/lib/libssl.a"
          test -s "$HOME/android-openssl/android-ssl/arm64-v8a/lib/libcrypto.a"

      - name: Resolve Go version required by SlipNet and Xray
        id: gover
        shell: bash
        run: |
          set -euo pipefail

          SLIP_GO="$(awk '$1 == "go" { print $2; exit }' .native-src/slipnet/gomobile-build/go.mod)"
          XRAY_GO="$(awk '$1 == "go" { print $2; exit }' .native-src/xray/go.mod)"

          test -n "$SLIP_GO"
          test -n "$XRAY_GO"

          WANT_GO="$(printf '%s\n%s\n' "$SLIP_GO" "$XRAY_GO" | sort -V | tail -n 1)"

          echo "SlipNet gomobile-build requires Go: $SLIP_GO"
          echo "AndroidLibXrayLite requires Go:     $XRAY_GO"
          echo "Using Go:                           $WANT_GO"

          echo "version=$WANT_GO" >> "$GITHUB_OUTPUT"

      - name: Setup Go for SlipNet and Xray
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache: false

      # ==================================================
      # COMBINED SLIPNET + XRAY GO RUNTIME
      # ==================================================

      - name: Build combined SlipNet and Xray Go runtime
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"

          MIN_MOBILE_VERSION="v0.0.0-20260611195102-4dd8f1dbf5d2"
          XRAY_MODULE="github.com/2dust/AndroidLibXrayLite"
          XRAY_DIR="$(cd "$GITHUB_WORKSPACE/.native-src/xray" && pwd -P)"
          BIND_DIR="$GITHUB_WORKSPACE/.native-src/slipnet/gomobile-build"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_CC="$NDK_BIN/aarch64-linux-android24-clang"

          export PATH="$(go env GOPATH)/bin:$PATH"

          echo "::group::Toolchain"
          go version
          go env GOTOOLCHAIN GOFLAGS GOWORK GOPROXY
          echo "::endgroup::"

          test -x "$NDK_CC"
          grep -lq '^package libv2ray' "$XRAY_DIR"/*.go

          # --------------------------------------------------
          # 1. Make the combined Go module consistent.
          # --------------------------------------------------

          cd "$BIND_DIR"

          cp go.mod "$RUNNER_TEMP/gomobile-build.go.mod.before"
          [ ! -f go.sum ] || cp go.sum "$RUNNER_TEMP/gomobile-build.go.sum.before"

          go mod edit \
            -require="${XRAY_MODULE}@v0.0.0" \
            -require="golang.org/x/mobile@${MIN_MOBILE_VERSION}" \
            -replace="${XRAY_MODULE}=${XRAY_DIR}"

          # Keep Xray in the module dependency graph.
          mkdir -p xraydep
          cat > xraydep/deps.go <<'GO'
          //go:build tools

          package xraydep

          import _ "github.com/2dust/AndroidLibXrayLite"
          GO

          # FIX: Resolve the legacy genproto parent/submodule overlap.
          # This avoids ambiguous imports for googleapis/rpc/status,
          # googleapis/rpc/code and googleapis/rpc/errdetails.
          go get google.golang.org/genproto@v0.0.0-20230526161137-0005af68ea54

          echo "::group::go mod tidy"
          go mod tidy
          echo "::endgroup::"

          SEL_MOBILE="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          echo "x/mobile selected by module graph: $SEL_MOBILE"
          echo "x/mobile workflow minimum:         $MIN_MOBILE_VERSION"

          (
            cd "$RUNNER_TEMP"
            go install "golang.org/x/mobile/cmd/gomobile@${SEL_MOBILE}"
            go install "golang.org/x/mobile/cmd/gobind@${SEL_MOBILE}"
          )

          gomobile init

          go get -tool "golang.org/x/mobile/cmd/gobind@${SEL_MOBILE}"

          grep -Fq "$XRAY_MODULE" go.mod || {
            echo "::error::go mod tidy removed $XRAY_MODULE from go.mod"
            exit 1
          }

          XRAY_LISTED_DIR="$(go list -f '{{.Dir}}' "$XRAY_MODULE")"
          test -n "$XRAY_LISTED_DIR"

          RESOLVED_XRAY="$(cd "$XRAY_LISTED_DIR" && pwd -P)"

          echo "Expected Xray: $XRAY_DIR"
          echo "Resolved Xray: $RESOLVED_XRAY"

          test "$RESOLVED_XRAY" = "$XRAY_DIR"

          grep -Fq 'golang.org/x/mobile/cmd/gobind' go.mod

          # --------------------------------------------------
          # 2. Check Xray package for android/arm64.
          # --------------------------------------------------

          export_android_env() {
            export GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$NDK_CC"
          }

          echo "::group::Xray package as loaded for android/arm64"
          (
            export_android_env
            go list -e -f 'Name={{.Name}}{{"\n"}}Dir={{.Dir}}{{"\n"}}GoFiles={{.GoFiles}}{{"\n"}}IgnoredGoFiles={{.IgnoredGoFiles}}{{"\n"}}Error={{if .Error}}{{.Error}}{{end}}{{"\n"}}DepsErrors={{range .DepsErrors}}{{.Err}}; {{end}}' "$XRAY_MODULE"
          )
          echo "::endgroup::"

          PKG_NAME="$(export_android_env; go list -e -f '{{.Name}}' "$XRAY_MODULE")"
          PKG_FILES="$(export_android_env; go list -e -f '{{len .GoFiles}}' "$XRAY_MODULE")"
          PKG_ERROR="$(export_android_env; go list -e -f '{{if .Error}}{{.Error}}{{end}}' "$XRAY_MODULE")"
          PKG_DEPS_ERROR="$(export_android_env; go list -e -f '{{range .DepsErrors}}{{.Err}}; {{end}}' "$XRAY_MODULE")"

          if [ "$PKG_NAME" != "libv2ray" ] || [ "$PKG_FILES" -lt 1 ]; then
            echo "::error::Xray package resolves to name='$PKG_NAME' with $PKG_FILES Go files for android/arm64 (expected libv2ray)."
            exit 1
          fi

          if [ -n "$PKG_ERROR" ] || [ -n "$PKG_DEPS_ERROR" ]; then
            echo "::error::Xray package has load errors: $PKG_ERROR $PKG_DEPS_ERROR"
            exit 1
          fi

          echo "::group::Standalone compile of Xray for android/arm64"
          (
            export_android_env
            go build -trimpath "$XRAY_MODULE"
          ) || echo "::warning::Standalone android/arm64 compile of the Xray package failed."
          echo "::endgroup::"

          echo "::group::gobind probe (Xray package alone)"
          rm -rf "$RUNNER_TEMP/gobind-probe"
          mkdir -p "$RUNNER_TEMP/gobind-probe"
          (
            export_android_env
            gobind -lang=go,java -outdir="$RUNNER_TEMP/gobind-probe" "$XRAY_MODULE"
          ) || echo "::warning::gobind cannot bind the Xray package alone."
          find "$RUNNER_TEMP/gobind-probe" -name 'Libv2ray.java' -print
          echo "::endgroup::"

          # --------------------------------------------------
          # 3. Add Xray to SlipNet build-full target.
          # --------------------------------------------------

          echo "::group::SlipNet Makefile before patch"
          cat -n Makefile
          echo "::endgroup::"

          python3 - <<'PY'
          from pathlib import Path
          import re

          XRAY = "github.com/2dust/AndroidLibXrayLite"

          makefile = Path("Makefile")
          text = makefile.read_text()

          if XRAY not in text:
              anchor = "\t\tsnowflake-mobile/snowflake\n"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: Expected SlipNet Makefile entry was not found."
                  )

              text = text.replace(
                  anchor,
                  "\t\tsnowflake-mobile/snowflake \\\n\t\t" + XRAY + "\n",
                  1,
              )

          text = text.replace(
              "android/arm,android/arm64,android/amd64",
              "android/arm64",
          )

          def add_flag(line):
              if "checklinkname" in line:
                  return line
              return re.sub(
                  r"(-ldflags(?:=|\s+)\s*)([\"'])",
                  r"\1\2-checklinkname=0 ",
                  line,
              )

          text = "".join(add_flag(line) for line in text.splitlines(True))

          if "checklinkname=0" not in text:
              raise SystemExit(
                  "ERROR: could not add -checklinkname=0."
              )

          match = re.search(
              r"(?m)^build-full:[^\n]*\n((?:[ \t][^\n]*\n|\n)*)",
              text,
          )

          if not match or XRAY not in match.group(0):
              raise SystemExit(
                  "ERROR: Xray package is not inside the build-full recipe."
              )

          makefile.write_text(text)

          print("Combined SlipNet + Xray configuration prepared.")
          PY

          echo "::group::SlipNet Makefile after patch"
          cat -n Makefile
          echo "::endgroup::"

          # --------------------------------------------------
          # 4. Build combined AAR.
          # --------------------------------------------------

          make build-full

          mkdir -p "$GITHUB_WORKSPACE/app/libs"

          cp ../app/libs/golibs-full.aar \
            "$GITHUB_WORKSPACE/app/libs/golibs-full.aar"

          AAR="$GITHUB_WORKSPACE/app/libs/golibs-full.aar"

          test -s "$AAR"

          # --------------------------------------------------
          # 5. Verify generated Xray API.
          # --------------------------------------------------

          CLASSES_JAR="$RUNNER_TEMP/tirexnet-golibs-classes.jar"

          unzip -p "$AAR" classes.jar > "$CLASSES_JAR"
          jar tf "$CLASSES_JAR" > "$RUNNER_TEMP/golibs-classes.txt"
          unzip -Z1 "$AAR" > "$RUNNER_TEMP/golibs-aar.txt"

          for cls in \
            go/Seq.class \
            libv2ray/Libv2ray.class \
            libv2ray/CoreController.class \
            libv2ray/CoreCallbackHandler.class
          do
            grep -qx "$cls" "$RUNNER_TEMP/golibs-classes.txt" || {
              echo "::error::golibs-full.aar is missing $cls"
              exit 1
            }
          done

          javap -public -cp "$CLASSES_JAR" \
            libv2ray.Libv2ray \
            libv2ray.CoreController \
            libv2ray.CoreCallbackHandler \
            > "$RUNNER_TEMP/libv2ray-api.txt"

          cat "$RUNNER_TEMP/libv2ray-api.txt"

          require_api() {
            grep -Fq -- "$1" "$RUNNER_TEMP/libv2ray-api.txt" || {
              echo "::error::XrayVpnService.kt needs '$1' but golibs-full.aar does not provide it"
              exit 1
            }
          }

          require_api 'initCoreEnv(java.lang.String, java.lang.String)'
          require_api 'newCoreController(libv2ray.CoreCallbackHandler)'
          require_api 'startLoop(java.lang.String, int)'
          require_api 'stopLoop()'
          require_api 'long startup()'
          require_api 'long shutdown()'
          require_api 'long onEmitStatus(long, java.lang.String)'

          echo "libgojni entries in AAR:"
          grep 'libgojni\.so$' "$RUNNER_TEMP/golibs-aar.txt" || true

          GOJNI_ARM64="$(grep -c '^jni/arm64-v8a/libgojni\.so$' "$RUNNER_TEMP/golibs-aar.txt" || true)"

          test "$GOJNI_ARM64" -eq 1 || {
            echo "::error::Expected exactly one jni/arm64-v8a/libgojni.so, found $GOJNI_ARM64"
            exit 1
          }

          echo "Combined SlipNet + Xray AAR verified."

      - name: Prepare TIREXNET release signing key
        env:
          TIREXNET_KEYSTORE_BASE64: ${{ secrets.TIREXNET_KEYSTORE_BASE64 }}
          TIREXNET_STORE_PASSWORD: ${{ secrets.TIREXNET_STORE_PASSWORD }}
          TIREXNET_KEY_PASSWORD: ${{ secrets.TIREXNET_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$TIREXNET_KEYSTORE_BASE64" || {
            echo "::error::Missing secret TIREXNET_KEYSTORE_BASE64"
            exit 1
          }

          test -n "$TIREXNET_STORE_PASSWORD" || {
            echo "::error::Missing secret TIREXNET_STORE_PASSWORD"
            exit 1
          }

          test -n "$TIREXNET_KEY_PASSWORD" || {
            echo "::error::Missing secret TIREXNET_KEY_PASSWORD"
            exit 1
          }

          printf '%s' "$TIREXNET_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/tirexnet-release.jks"

          test -s "$RUNNER_TEMP/tirexnet-release.jks"

          echo "TIREXNET_KEYSTORE_PATH=$RUNNER_TEMP/tirexnet-release.jks" \
            >> "$GITHUB_ENV"

          printf 'TIREXNET_STORE_PASSWORD=%s\n' "$TIREXNET_STORE_PASSWORD" \
            >> "$GITHUB_ENV"

          printf 'TIREXNET_KEY_PASSWORD=%s\n' "$TIREXNET_KEY_PASSWORD" \
            >> "$GITHUB_ENV"

      - name: Detect TIREXNET signing alias
        env:
          TIREXNET_KEY_ALIAS_INPUT: ${{ secrets.TIREXNET_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t KEY_ALIASES < <(
            keytool -list -v \
              -keystore "$TIREXNET_KEYSTORE_PATH" \
              -storepass "$TIREXNET_STORE_PASSWORD" 2>/dev/null |
            awk '
              /^Alias name: / {
                alias=substr($0,13)
              }
              /^Entry type: PrivateKeyEntry/ {
                print alias
              }
            '
          )

          test "${#KEY_ALIASES[@]}" -gt 0 || {
            echo "::error::No private key found in keystore"
            exit 1
          }

          SELECTED_ALIAS=""

          if [ -n "${TIREXNET_KEY_ALIAS_INPUT:-}" ]; then
            for alias in "${KEY_ALIASES[@]}"; do
              [ "$alias" = "$TIREXNET_KEY_ALIAS_INPUT" ] \
                && SELECTED_ALIAS="$alias"
            done
          fi

          if [ -z "$SELECTED_ALIAS" ]; then
            [ "${#KEY_ALIASES[@]}" -eq 1 ] || {
              echo "::error::Set TIREXNET_KEY_ALIAS to an existing private-key alias"
              printf '%s\n' "${KEY_ALIASES[@]}"
              exit 1
            }

            SELECTED_ALIAS="${KEY_ALIASES[0]}"
          fi

          echo "TIREXNET_KEY_ALIAS=$SELECTED_ALIAS" >> "$GITHUB_ENV"

      - name: Validate TIREXNET signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sign-check"

          printf 'TIREXNET signing validation\n' \
            > "$RUNNER_TEMP/sign-check/check.txt"

          jar --create \
            --file "$RUNNER_TEMP/sign-check.jar" \
            -C "$RUNNER_TEMP/sign-check" \
            check.txt

          jarsigner \
            -keystore "$TIREXNET_KEYSTORE_PATH" \
            -storepass "$TIREXNET_STORE_PASSWORD" \
            -keypass "$TIREXNET_KEY_PASSWORD" \
            "$RUNNER_TEMP/sign-check.jar" \
            "$TIREXNET_KEY_ALIAS"

          jarsigner -verify "$RUNNER_TEMP/sign-check.jar" >/dev/null

      - name: Checkout MHRV
        uses: actions/checkout@v4
        with:
          repository: therealaleph/MasterHttpRelayVPN-RUST
          ref: v1.9.38
          path: .native-src/mhrv

      - name: Build MHRV Android native library
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"

          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

          cd .native-src/mhrv

          cargo ndk \
            -t arm64-v8a \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            build --release --lib

          ABI_DIR="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          test -s "$ABI_DIR/libmhrv_rs.so"

          shopt -s nullglob
          TUN2PROXY_LIBS=("$ABI_DIR"/libtun2proxy-*.so)

          if [ "${#TUN2PROXY_LIBS[@]}" -gt 0 ]; then
            cp "${TUN2PROXY_LIBS[0]}" "$ABI_DIR/libtun2proxy.so"
            rm -f "${TUN2PROXY_LIBS[@]}"
          fi

          test -s "$ABI_DIR/libtun2proxy.so"

      - name: Setup Go for existing engines
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Checkout StormDNS
        uses: actions/checkout@v4
        with:
          repository: nullroute1970/StormDNS
          ref: a9a8e92a51f08c3030d7a1656cafd3bf07c9903b
          path: .native-src/stormdns

      - name: Build StormDNS Android ARM64 client
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd .native-src/stormdns

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build \
              -trimpath \
              -buildmode=pie \
              -ldflags='-s -w' \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstormdns.so" \
              ./cmd/client

          test -s "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstormdns.so"

      - name: Checkout MasterDnsVPN
        uses: actions/checkout@v4
        with:
          repository: masterking32/MasterDnsVPN
          # TODO: pin this to a reviewed commit SHA after the first green build (same as the other native engines).
          ref: main
          path: .native-src/masterdnsvpn

      - name: Build MasterDnsVPN Android ARM64 client
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/third_party
          cd .native-src/masterdnsvpn

          PKG=""
          for candidate in ./cmd/client ./cmd/masterdnsvpn-client ./client; do
            if [ -d "$candidate" ]; then PKG="$candidate"; break; fi
          done
          if [ -z "$PKG" ]; then
            echo "::error::MasterDnsVPN client entry point not found (expected ./cmd/client). Update this step to the upstream layout."
            ls -la
            exit 1
          fi

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build \
              -trimpath \
              -buildmode=pie \
              -ldflags='-s -w' \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmasterdnsvpn.so" \
              "$PKG"

          test -s "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmasterdnsvpn.so"

          # Keep the upstream license/copyright notice with the shipped binary.
          for f in LICENSE LICENSE.txt LICENSE.md COPYING; do
            if [ -f "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/app/src/main/assets/third_party/MASTERDNSVPN-LICENSE.txt"; break; fi
          done

      - name: Checkout CottenDNS
        uses: actions/checkout@v4
        with:
          repository: WhiteDNS/CottenDNS
          # Release tag published in the CottenDNS README (MIT). Replace with a commit SHA after the first green build.
          ref: v2026.10.21.140901-0a7a241
          path: .native-src/cottendns

      - name: Build CottenDNS Android ARM64 client
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/third_party
          cd .native-src/cottendns

          test -d cmd/client

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build \
              -trimpath \
              -buildmode=pie \
              -ldflags='-s -w' \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libcottendns.so" \
              ./cmd/client

          test -s "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libcottendns.so"

          cp LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/third_party/COTTENDNS-MIT.txt"
          for f in SOAR_LICENSE.txt QUIC_GO_LICENSE.txt QPACK_LICENSE.txt THIRD_PARTY_NOTICES.md; do
            if [ -f "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/app/src/main/assets/third_party/COTTENDNS-$f"; fi
          done
          test -s "$GITHUB_WORKSPACE/app/src/main/assets/third_party/COTTENDNS-MIT.txt"

      - name: Checkout SNISPF
        uses: actions/checkout@v4
        with:
          repository: AlirezaParsi/snispf
          ref: 70ff7966ca6aa928ef63619f0b3fbaa136088325
          path: .native-src/snispf

      - name: Build Patterniha-compatible SNI fragmentation engine
        shell: bash
        run: |
          set -euo pipefail

          cd .native-src/snispf/engine

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build \
              -trimpath \
              -buildmode=pie \
              -ldflags='-s -w' \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsnispf.so" \
              ./cmd/snispf

          test -s "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsnispf.so"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build TIREXNET with SlipNet and Xray runtime
        env:
          SLIPNET_CONFIG_ENCRYPTION_KEY: ${{ secrets.SLIPNET_CONFIG_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # Feed the official SlipNet native build input.
          if [[ ! "${SLIPNET_CONFIG_ENCRYPTION_KEY:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::SLIPNET_CONFIG_ENCRYPTION_KEY must be exactly 64 hexadecimal characters."
            exit 1
          fi

          umask 077
          printf 'CONFIG_ENCRYPTION_KEY=%s\\n' "$SLIPNET_CONFIG_ENCRYPTION_KEY" > local.properties
          unset SLIPNET_CONFIG_ENCRYPTION_KEY

          gradle --no-daemon --stacktrace assembleDebug assembleRelease

          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/debug/app-debug.apk

          echo "TIREXNET APK build completed."

      - name: Upload TIREXNET Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TIREXNET-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload TIREXNET Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TIREXNET-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
