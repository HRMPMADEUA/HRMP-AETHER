name: TIREXNET Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Download Xray engine
        run: |
          mkdir -p app/libs
          curl -fL \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.6.27/libv2ray.aar \
            -o app/libs/libv2ray.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build TIREXNET APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIREXNET-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
