name: HRMP AETHER Android Build
'on': [push, workflow_dispatch]
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v5, with: {distribution: temurin, java-version: '17'}}, {run: yes | sdkmanager --licenses}, {run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"}, {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: '8.9'}}, {run: gradle --no-daemon assembleDebug}, {uses: actions/upload-artifact@v4, with: {name: HRMP-AETHER-APK, path: app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error}}]}}
