name: TIREXNET Windows x64 Build

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tirexnet-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      APP_VERSION: '1.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify that Windows commits do not touch Android or backend files
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            before="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Inspecting commits in $before..HEAD"
          bad=0
          for c in $(git rev-list "$before..HEAD"); do
            win=0; prot=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                windows/*|.github/workflows/build-windows.yml) win=1 ;;
                app/*|gradle/*|gradlew|gradlew.bat|settings.gradle|build.gradle|gradle.properties|scripts/*|.github/workflows/build-apk.yml) prot=1; echo "  protected path in $c: $f" ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r -m "$c")
            if [ "$win" -eq 1 ] && [ "$prot" -eq 1 ]; then
              echo "::error::Commit $c changes both the Windows project and protected Android/backend files."
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "OK: no commit mixes Windows changes with Android/backend changes."

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        working-directory: windows
        run: dotnet restore TIREXNET.sln

      - name: Build Core library (Release)
        shell: pwsh
        working-directory: windows
        run: |
          dotnet build src/TIREXNET.Core/TIREXNET.Core.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed.' }

      - name: Generate application icon
        shell: pwsh
        working-directory: windows
        run: |
          $assetsDir = Join-Path (Get-Location) 'src/TIREXNET.App/Assets'
          [System.IO.Directory]::CreateDirectory($assetsDir) | Out-Null
          $out = [System.IO.Path]::GetFullPath((Join-Path $assetsDir 'tirexnet.ico'))
          Write-Host "Icon output path: $out"
          & ./scripts/make-icon.ps1 -Out $out
          if ($LASTEXITCODE -ne 0) { throw "make-icon.ps1 failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw "Icon file was not created: $out" }
          $len = (Get-Item $out).Length
          if ($len -lt 1000) { throw "Icon file is suspiciously small ($len bytes)" }
          $bytes = [System.IO.File]::ReadAllBytes($out)
          $reserved = [BitConverter]::ToUInt16($bytes, 0)
          $type     = [BitConverter]::ToUInt16($bytes, 2)
          $count    = [BitConverter]::ToUInt16($bytes, 4)
          if ($reserved -ne 0) { throw "Invalid ICO: Reserved=$reserved (expected 0)" }
          if ($type -ne 1)     { throw "Invalid ICO: Type=$type (expected 1)" }
          if ($count -ne 6)    { throw "Invalid ICO: ImageCount=$count (expected 6)" }
          Write-Host "Valid ICO written ($len bytes, $count images)."

      - name: Build WPF application (Release, x64)
        shell: pwsh
        working-directory: windows
        run: |
          dotnet build src/TIREXNET.App/TIREXNET.App.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'WPF application build failed.' }

      - name: Unit tests (parsers, validation, process lifecycle)
        shell: pwsh
        working-directory: windows
        run: |
          dotnet test tests/TIREXNET.Tests/TIREXNET.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory ../test-results
          if ($LASTEXITCODE -ne 0) { throw "Tests failed (exit code $LASTEXITCODE)." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TIREXNET-Windows-x64-TestResults
          path: test-results/*.trx
          if-no-files-found: ignore

      - name: Publish TIREXNET.exe (win-x64, self-contained)
        shell: pwsh
        working-directory: windows
        run: |
          dotnet publish src/TIREXNET.App/TIREXNET.App.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$env:APP_VERSION -p:PlatformTarget=x64 -o ../dist/stage/app
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path ../dist/stage/app/TIREXNET.exe)) { throw 'TIREXNET.exe was not produced.' }

      - name: Fetch, verify and stage engine runtimes
        shell: pwsh
        working-directory: windows
        run: ./scripts/fetch-engines.ps1 -Stage ../dist/stage

      - name: Add notices, icon and documentation
        shell: pwsh
        working-directory: windows
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md ../dist/stage/ -Force
          Copy-Item README.md ../dist/stage/ -Force
          Copy-Item src/TIREXNET.App/Assets/tirexnet.ico ../dist/stage/ -Force

      - name: Verify the staged package
        shell: pwsh
        run: |
          $s = 'dist/stage'
          $required = @(
            'app/TIREXNET.exe', 'app/TIREXNET.Core.dll',
            'engines/xray/xray.exe',
            'engines/tun2socks/tun2socks.exe', 'engines/tun2socks/wintun.dll',
            'engines/wireguard/wireguard.exe',
            'THIRD_PARTY_NOTICES.md'
          )
          foreach ($r in $required) {
            $p = Join-Path $s $r
            if (-not (Test-Path $p)) { throw "Missing from package: $r" }
            if ((Get-Item $p).Length -lt 1024) { throw "Suspiciously small file: $r" }
          }
          $lic = @(Get-ChildItem (Join-Path $s 'licenses') -File -ErrorAction SilentlyContinue)
          if ($lic.Count -lt 3) { throw "Expected at least 3 license files, found $($lic.Count)." }
          $pe = [System.IO.File]::ReadAllBytes((Resolve-Path "$s/app/TIREXNET.exe"))
          $peOffset = [BitConverter]::ToInt32($pe, 0x3C)
          $machine = [BitConverter]::ToUInt16($pe, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ('TIREXNET.exe is not x64 (machine type 0x{0:X})' -f $machine) }
          Write-Host 'TIREXNET.exe is a genuine x64 PE executable.'
          & "$s/engines/xray/xray.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'xray.exe did not run.' }
          Write-Host "Licenses: $($lic.Name -join ', ')"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/out | Out-Null
          $portable = 'dist/portable/TIREXNET'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item dist/stage/app/* $portable -Recurse -Force
          Copy-Item dist/stage/engines $portable -Recurse -Force
          Copy-Item dist/stage/licenses $portable -Recurse -Force
          Copy-Item dist/stage/THIRD_PARTY_NOTICES.md, dist/stage/README.md $portable -Force
          Compress-Archive -Path "$portable" -DestinationPath dist/out/TIREXNET-Windows-x64-Portable.zip -Force
          Copy-Item dist/stage/app/TIREXNET.exe dist/out/TIREXNET.exe -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = $null
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles)
          foreach ($root in $roots) {
            if ([string]::IsNullOrEmpty($root)) { continue }
            $candidate = Join-Path $root 'Inno Setup 6\ISCC.exe'
            if (Test-Path -LiteralPath $candidate) { $iscc = $candidate; break }
          }
          if (-not $iscc) {
            Write-Host 'ISCC.exe not found; installing Inno Setup via Chocolatey...'
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              choco install innosetup --no-progress -y --force
              if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
            }
            foreach ($root in $roots) {
              if ([string]::IsNullOrEmpty($root)) { continue }
              $candidate = Join-Path $root 'Inno Setup 6\ISCC.exe'
              if (Test-Path -LiteralPath $candidate) { $iscc = $candidate; break }
            }
          }
          if (-not $iscc) { throw 'ISCC.exe not found after install attempt.' }
          Write-Host "Using ISCC: $iscc"
          $src = (Resolve-Path dist/stage).Path
          $out = (Resolve-Path dist/out).Path
          & $iscc "/DSourceDir=$src" "/DOutputDir=$out" "/DAppVersion=$env:APP_VERSION" windows/installer/TIREXNET.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          if (-not (Test-Path "$out/TIREXNET-Windows-x64-Setup.exe")) { throw 'The installer was not produced.' }

      - name: Smoke-test installer (silent install, check files, silent uninstall)
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist/out/TIREXNET-Windows-x64-Setup.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'TIREXNET-install-test'
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed with exit code $($p.ExitCode)" }
          foreach ($f in 'TIREXNET.exe', 'engines\xray\xray.exe', 'engines\wireguard\wireguard.exe', 'engines\tun2socks\wintun.dll', 'licenses') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Installed package is missing $f" }
          }
          $un = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $un) { throw 'Uninstaller not found.' }
          $u = Start-Process $un.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'TIREXNET.exe')) { throw 'TIREXNET.exe still present after uninstall.' }
          Write-Host 'Installer smoke test passed (install + clean uninstall).'

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/out -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Tee-Object -FilePath dist/out/SHA256SUMS.txt
          Get-Content dist/out/SHA256SUMS.txt | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TIREXNET-Windows-x64-Portable.zip
          path: dist/out/TIREXNET-Windows-x64-Portable.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TIREXNET-Windows-x64-Setup.exe
          path: dist/out/TIREXNET-Windows-x64-Setup.exe
          if-no-files-found: error

      - name: Upload full build output
        uses: actions/upload-artifact@v4
        with:
          name: TIREXNET-Windows-x64-Build
          path: |
            dist/out/*
            dist/stage/engines-verification.txt
          if-no-files-found: error
