plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tirexnet.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tirexnet.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '3.2'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.jetbrains.kotlin' &&
            requested.name.startsWith('kotlin-stdlib')) {
            useVersion '2.3.0'
        }
    }
}

dependencies {
    implementation 'com.wgtunnel:parser:1.6.14'
    implementation 'com.wgtunnel:backend:1.6.14'
    implementation 'com.wgtunnel:backend-android-jni:1.6.14'
    implementation 'com.wgtunnel:hevtunnel:1.6.14'
    implementation files('libs/libv2ray.aar')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}
