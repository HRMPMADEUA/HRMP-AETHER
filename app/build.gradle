plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hrmp.aether'
    compileSdk 37

    defaultConfig {
        applicationId 'com.hrmp.aether'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1-beta'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
