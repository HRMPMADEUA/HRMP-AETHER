plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'org.mozilla.rust-android-gradle.rust-android'
}

android {
    namespace 'com.tirexnet.app'

    // Android 17 / API 37
    compileSdk 37

    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.tirexnet.app'

        minSdk 26
        targetSdk 35

        versionCode 6
        versionName '3.3'

        ndk {
            abiFilters 'arm64-v8a'
        }

        buildConfigField 'boolean', 'INCLUDE_TOR', 'true'
        buildConfigField 'boolean', 'INCLUDE_NAIVE', 'true'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('TIREXNET_KEYSTORE_PATH')

            if (keystorePath == null || keystorePath.trim().isEmpty()) {
                throw new GradleException(
                    'TIREXNET release keystore path is missing.'
                )
            }

            storeFile file(keystorePath)
            storePassword System.getenv('TIREXNET_STORE_PASSWORD')
            keyAlias System.getenv('TIREXNET_KEY_ALIAS')
            keyPassword System.getenv('TIREXNET_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }

        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/cpp/Android.mk')
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}


// ======================================================
// SLIPNET RUST / QUIC / SLIPSTREAM
// ======================================================

def cargoHome = System.getenv('HOME') + '/.cargo'
def cargoBin = "$cargoHome/bin"

def opensslBaseDir = file(
    "${System.getenv('HOME')}/android-openssl/android-ssl"
)

def opensslAbiDir = new File(
    opensslBaseDir,
    'arm64-v8a'
)

def cargoProfile = 'release'

def configEncryptionKey =
    System.getenv('SLIPNET_CONFIG_ENCRYPTION_KEY') ?: ''

if (!configEncryptionKey.isEmpty() &&
        !(configEncryptionKey ==~ /[0-9a-fA-F]{64}/)) {

    throw new GradleException(
        'SLIPNET_CONFIG_ENCRYPTION_KEY must be exactly 64 hexadecimal characters when configured.'
    )
}


// ======================================================
// OPENSSL VALIDATION
// ======================================================

tasks.register('verifySlipNetOpenSsl') {

    group = 'verification'

    doLast {

        ['libssl.a', 'libcrypto.a'].each { lib ->

            def libraryFile = new File(
                opensslAbiDir,
                "lib/${lib}"
            )

            if (!libraryFile.isFile()) {

                throw new GradleException(
                    "Missing SlipNet OpenSSL file: ${libraryFile}"
                )
            }
        }

        def opensslHeaders = new File(
            opensslAbiDir,
            'include/openssl'
        )

        if (!opensslHeaders.isDirectory()) {

            throw new GradleException(
                "Missing SlipNet OpenSSL headers under ${opensslAbiDir}/include"
            )
        }
    }
}


// ======================================================
// RUST ANDROID GRADLE
// ======================================================

cargo {

    cargoCommand = "$cargoBin/cargo"
    rustcCommand = "$cargoBin/rustc"

    module = 'src/main/rust/slipstream-rust'
    libname = 'slipstream'

    targets = ['arm64']

    profile = cargoProfile
    rustupChannel = 'stable'

    extraCargoBuildArguments = [
        '-p',
        'slipstream-client',
        '--lib',
        '--features',
        'openssl-static,picoquic-minimal-build'
    ]

    exec = { spec, toolchain ->

        def currentPath = System.getenv('PATH') ?: ''

        spec.environment(
            'PATH',
            "$cargoHome/bin:$currentPath"
        )

        spec.environment(
            'RUST_ANDROID_GRADLE_PYTHON_COMMAND',
            'python3'
        )

        spec.environment(
            'RUST_ANDROID_GRADLE_CC_LINK_ARG',
            '-Wl,-z,max-page-size=16384,-soname,libslipstream.so'
        )

        spec.environment(
            'RUST_ANDROID_GRADLE_LINKER_WRAPPER_PY',
            "$projectDir/src/main/rust/linker-wrapper.py"
        )

        spec.environment(
            'RUST_ANDROID_GRADLE_TARGET',
            "target/${toolchain.target}/release/libslipstream.so"
        )

        spec.environment(
            'ANDROID_NDK_HOME',
            android.ndkDirectory.absolutePath
        )

        spec.environment('ANDROID_ABI', 'arm64-v8a')
        spec.environment('ANDROID_PLATFORM', 'android-26')

        spec.environment(
            'PICOQUIC_BUILD_DIR',
            "$projectDir/src/main/rust/slipstream-rust/.picoquic-build/arm64-v8a"
        )

        spec.environment('PICOQUIC_AUTO_BUILD', '1')
        spec.environment('BUILD_TYPE', 'Release')

        spec.environment(
            'OPENSSL_DIR',
            opensslAbiDir.absolutePath
        )

        spec.environment(
            'OPENSSL_LIB_DIR',
            new File(opensslAbiDir, 'lib').absolutePath
        )

        spec.environment(
            'OPENSSL_INCLUDE_DIR',
            new File(opensslAbiDir, 'include').absolutePath
        )

        spec.environment(
            'OPENSSL_ROOT_DIR',
            opensslAbiDir.absolutePath
        )

        spec.environment(
            'OPENSSL_CRYPTO_LIBRARY',
            new File(
                opensslAbiDir,
                'lib/libcrypto.a'
            ).absolutePath
        )

        spec.environment(
            'OPENSSL_SSL_LIBRARY',
            new File(
                opensslAbiDir,
                'lib/libssl.a'
            ).absolutePath
        )

        spec.environment(
            'OPENSSL_USE_STATIC_LIBS',
            '1'
        )

        spec.environment(
            'CONFIG_ENCRYPTION_KEY',
            configEncryptionKey
        )

        spec.environment(
            'CARGO_ENCODED_RUSTFLAGS',
            "--remap-path-prefix=${System.getProperty('user.home')}=~"
        )

        def llvmPrebuiltRoot = new File(
            android.ndkDirectory,
            'toolchains/llvm/prebuilt'
        )

        def prebuilt = llvmPrebuiltRoot.listFiles()?.find {
            it.isDirectory()
        }

        if (prebuilt != null) {

            spec.environment(
                'AR',
                new File(
                    prebuilt,
                    'bin/llvm-ar'
                ).absolutePath
            )

            spec.environment(
                'RANLIB',
                new File(
                    prebuilt,
                    'bin/llvm-ranlib'
                ).absolutePath
            )
        }
    }
}


// ======================================================
// BUILD TASK DEPENDENCIES
// ======================================================

tasks.configureEach { task ->

    if (task.name == 'cargoBuildArm64') {
        task.dependsOn('verifySlipNetOpenSsl')
    }

    if (task.name in [
        'mergeDebugJniLibFolders',
        'mergeReleaseJniLibFolders'
    ]) {

        task.dependsOn('cargoBuild')

        task.inputs.dir(
            layout.buildDirectory.dir('rustJniLibs/android')
        )
    }
}


// ======================================================
// DEPENDENCIES
// ======================================================

dependencies {

    // WireGuard / Hysteria
    implementation 'com.wgtunnel:parser:1.6.14'
    implementation 'com.wgtunnel:backend:1.6.14'
    implementation 'com.wgtunnel:backend-android-jni:1.6.14'
    implementation 'com.wgtunnel:hevtunnel:1.6.14'


    // IMPORTANT:
    // SlipNet and Xray are now packaged into ONE Go AAR.
    // Do not add libv2ray.aar separately.

    implementation files('libs/golibs-full.aar')


    // ==================================================
    // COMPOSE
    // ==================================================

    def composeBom = platform(
        'androidx.compose:compose-bom:2026.01.01'
    )

    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'


    // ==================================================
    // ACTIVITY / NAVIGATION
    // ==================================================

    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.navigation:navigation-compose:2.9.7'


    // ==================================================
    // LIFECYCLE
    // ==================================================

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'


    // ==================================================
    // HILT
    // ==================================================

    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'

    implementation 'com.google.dagger:hilt-android:2.57.1'
    ksp 'com.google.dagger:hilt-compiler:2.57.1'


    // ==================================================
    // ROOM
    // ==================================================

    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'


    // ==================================================
    // DATASTORE / GSON / COROUTINES
    // ==================================================

    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'com.google.code.gson:gson:2.13.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'


    // ==================================================
    // SSH / TLS / DNS / IMPORT-EXPORT
    // ==================================================

    implementation 'com.github.mwiede:jsch:2.27.7'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    implementation 'sh.calvin.reorderable:reorderable:3.0.0'

    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    implementation 'androidx.core:core-ktx:1.17.0'
}


// ======================================================
// KSP
// ======================================================

ksp {
    arg(
        'room.schemaLocation',
        "$projectDir/schemas"
    )
}
